<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Raven Night • For Manu</title>
<meta name="theme-color" content="#000000" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#e9e9f4; --dim:#9a9ab2;
    --bg1:#04040a; --bg2:#0a0a14;
    --violet:#7a4cff; --rose:#ff3b81; --red:#ff3366; --cyan:#42d5ff; --gold:#ffcc66;
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));overflow:hidden;font-family:Inter,system-ui,Segoe UI,Roboto}
  /* Sky */
  .layer{position:fixed;inset:0;pointer-events:none}
  .stars{background:
      radial-gradient(1px 1px at 20% 30%, #fff8 50%, transparent 51%) repeat,
      radial-gradient(1px 1px at 70% 60%, #fff6 50%, transparent 51%) repeat,
      radial-gradient(1px 1px at 50% 10%, #fff7 50%, transparent 51%) repeat;
    background-size: 600px 400px, 900px 700px, 1200px 900px; opacity:.55; animation: twinkle 8s linear infinite}
  .nebula{background:
    radial-gradient(600px 300px at 15% 25%, rgba(122,76,255,.12), transparent 60%),
    radial-gradient(800px 400px at 85% 35%, rgba(66,213,255,.08), transparent 60%),
    radial-gradient(900px 500px at 50% 90%, rgba(255,59,129,.08), transparent 60%);}
  @keyframes twinkle{50%{opacity:.75}}
  .moon{position:fixed;width:170px;height:170px;border-radius:50%;
    top:50px; right:50px; filter:grayscale(.2); opacity:.28;
    background:radial-gradient(circle at 28% 30%, #e6e6ff 5%, #bdbdf7 34%, #5b5b8a 72%, #1a1a2b 100%);
    box-shadow:0 0 60px 10px #b7b7ff33 inset, 0 0 120px 18px #b7b7ff22;}
  /* Ravens */
  .flock{position:fixed;inset:0; pointer-events:none; opacity:.25}
  .bird{position:absolute;width:32px;height:18px;transform-origin:center;animation:fly 18s linear infinite}
  .bird:before,.bird:after{
    content:""; position:absolute; top:0; left:0; width:16px; height:18px; background:#0b0b12; border-radius:0 100% 0 100%;
    transform-origin:0 50%; animation:flap 1.2s ease-in-out infinite;
  }
  .bird:after{ left:auto; right:0; border-radius:100% 0 100% 0; transform-origin:100% 50%; animation-delay:.6s }
  @keyframes flap{ 0%,100%{transform:rotate(14deg)} 50%{transform:rotate(-18deg)} }
  @keyframes fly{
    0%{ transform: translateX(-10vw) translateY(0) scale(1) }
    50%{ transform: translateX(50vw) translateY(-10vh) scale(1.2) }
    100%{ transform: translateX(110vw) translateY(0) scale(1) }
  }
  /* Ghost‑soldier silhouette holding heart */
  .ghostWrap{position:fixed; left:30px; bottom:24px; width:220px; height:280px; z-index:6; pointer-events:auto}
  .ghost{
    width:100%; height:100%; position:relative; filter: drop-shadow(0 0 24px rgba(0,0,0,.6));
  }
  /* Body silhouette */
  .torso{ position:absolute; left:64px; bottom:60px; width:88px; height:120px; background:#0b0b12; border-radius:18px 18px 12px 12px }
  .head{ position:absolute; left:86px; bottom:190px; width:44px; height:44px; background:#0b0b12; border-radius:50% }
  .hood{ position:absolute; left:72px; bottom:182px; width:72px; height:64px; background:#0a0a10; border-radius:50% 50% 40% 40%; transform:rotate(-4deg) }
  .mask{ position:absolute; left:94px; bottom:198px; width:28px; height:18px; background:linear-gradient(90deg, #0a0a0f, #151521); border-radius:8px }
  .armL{ position:absolute; left:40px; bottom:130px; width:52px; height:18px; background:#0a0a10; border-radius:12px; transform-origin:100% 50%; transform:rotate(-14deg) }
  .armR{ position:absolute; left:140px; bottom:130px; width:52px; height:18px; background:#0a0a10; border-radius:12px; transform-origin:0% 50%; transform:rotate(14deg) }
  .pulse{ position:absolute; left:84px; bottom:112px; width:52px; height:52px; filter:blur(10px); background: radial-gradient(circle, rgba(255,59,129,.18), transparent 60%); animation:pulse 2.4s ease-in-out infinite }
  @keyframes pulse{ 50%{ transform:scale(1.08) } }

  /* Black heart the ghost holds */
  .heartBlk{
    position:absolute; left:86px; bottom:116px; width:64px; height:64px; transform:rotate(45deg);
    background:#06060b; border:1px solid #1e1e2a; box-shadow:0 0 20px rgba(0,0,0,.6) inset, 0 0 26px rgba(255,59,129,.12);
    cursor:pointer;
  }
  .heartBlk:before, .heartBlk:after{
    content:""; position:absolute; width:64px; height:64px; background:#06060b; border:1px solid #1e1e2a; border-radius:50%;
  }
  .heartBlk:before{ left:-32px; top:0 }
  .heartBlk:after{ left:0; top:-32px }

  .heartText{
    position:absolute; inset:0; transform:rotate(-45deg); display:flex; align-items:center; justify-content:center;
    font-family:Cinzel,serif; font-weight:700; letter-spacing:.4px; text-align:center; font-size:.82rem; color:#fff;
    background:linear-gradient(135deg, #ff4aa0, #ff3366); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 18px rgba(255,59,129,.25);
  }

  /* Main card */
  main{position:relative; z-index:10; max-width:900px; margin:10vh auto; padding:0 16px}
  .card{ background:linear-gradient(180deg, rgba(15,15,24,.82), rgba(8,8,12,.92));
    border:1px solid #1d1d27; border-radius:22px; padding:28px;
    box-shadow:0 0 36px rgba(122,76,255,.35), 0 20px 60px rgba(0,0,0,.6); backdrop-filter:blur(6px)}
  h1{font-family:Cinzel,serif; letter-spacing:.06em; text-align:center; margin:0 0 6px}
  .type{ text-align:center; min-height:48px; color:#cfcff7 }
  .timer{ text-align:center; color:#cfcff5; margin:10px 0 6px; font-weight:600 }
  .progress{height:8px; width:100%; background:#0f0f16; border:1px solid #232334; border-radius:999px; overflow:hidden; margin:8px 0 18px}
  .bar{height:100%; width:0%; background:linear-gradient(90deg,var(--violet),var(--rose),var(--cyan)); transition:width .45s ease}
  .q{ display:none; opacity:0; transform:translateY(12px); transition:opacity .35s ease, transform .35s ease }
  .q.show{ display:block; opacity:1; transform:translateY(0) }
  .prompt{ font-size:1.12rem; line-height:1.65; margin:10px 0 16px }
  .chips{ display:flex; gap:12px; flex-wrap:wrap }
  .chip{ border:1px solid #2c2c3b; background:#0c0c14; color:#e9e9f8; padding:10px 14px; border-radius:14px; cursor:pointer; transition:.2s }
  .chip:hover{ transform:translateY(-1px) } .chip.active{ background:linear-gradient(135deg,#1b1b2c,#23233b); border-color:#3b3b5a; box-shadow:0 0 0 2px rgba(122,76,255,.28) inset }
  .choices{ display:flex; gap:10px; flex-wrap:wrap }
  .btn{ appearance:none; border:1px solid #2a2a3b; background:#0c0c12; color:#f5f5ff; padding:10px 14px; border-radius:12px; cursor:pointer; font-weight:600 }
  .btn:hover{ transform:translateY(-1px) }
  .primary{ background:linear-gradient(135deg,#7a4cff,#ff3b81) }
  .pill{ border-radius:999px }
  .nav{ display:flex; justify-content:space-between; margin-top:16px; align-items:center }
  .hint{ text-align:center; color:#9a9ab2; font-size:.9rem; margin-top:10px }
  @media (max-width:560px){ main{ margin:8vh auto } .card{ padding:22px } .moon{ width:130px;height:130px; top:24px; right:24px } .ghostWrap{ transform:scale(.9); left:8px } }
</style>
</head>
<body>
  <!-- Background -->
  <div class="layer stars"></div>
  <div class="layer nebula"></div>
  <div class="layer moon"></div>
  <div class="flock" id="flock"></div>

  <!-- Original ghostly soldier (generic, not branded) -->
  <div class="ghostWrap" id="ghost">
    <div class="ghost">
      <div class="hood"></div>
      <div class="head"></div>
      <div class="mask"></div>
      <div class="torso"></div>
      <div class="armL"></div>
      <div class="armR"></div>
      <div class="pulse"></div>
      <div class="heartBlk" id="heart">
        <div class="heartText">I love Manu</div>
      </div>
    </div>
  </div>

  <main>
    <div class="card">
      <h1>For Manu</h1>
      <div class="type" id="type"></div>

      <div class="timer"><span id="time">10:00</span> left</div>
      <div class="progress"><div class="bar" id="bar"></div></div>

      <section id="wrap"></section>

      <div class="nav">
        <button class="btn pill" id="back" disabled>← Back</button>
        <div>
          <button class="btn pill" id="vibe">Play ambience</button>
          <button class="btn primary pill" id="next">Next →</button>
        </div>
      </div>

      <div class="hint">Tap choices, swipe left/right, or tap the black heart for a surprise.</div>
    </div>
    <p class="hint">Under raven wings, black turns romantic.</p>
  </main>

<script>
/* Intro typewriter */
const intro = [
  "The ravens circle. A quiet sentinel waits—with a black heart just for you.",
  "Every beat spells your name: Manu.",
  "Walk with me for a few minutes?",
];
const typeBox = document.getElementById('type');
let L=0, C=0; (function loop(){ if(L>=intro.length) return; const s=intro[L]; typeBox.textContent=s.slice(0,++C); if(C===s.length){L++; C=0; setTimeout(loop, 900);} else setTimeout(loop, 26+Math.random()*22); })();

/* 10‑minute timer and progress */
const totalSec=10*60, start=Date.now(); const timeEl=document.getElementById('time'); const bar=document.getElementById('bar');
setInterval(()=>{ const el=Math.floor((Date.now()-start)/1000); const left=Math.max(0,totalSec-el);
  timeEl.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;
  bar.style.width = `${Math.min(100,(idx/(flow.length-1))*100)}%`;
},1000);

/* Raven flock spawner */
const flock=document.getElementById('flock');
function spawnBird(){ const b=document.createElement('div'); b.className='bird'; b.style.top=(10+Math.random()*60)+'vh'; b.style.animationDelay=(-Math.random()*18)+'s'; b.style.transform=`translateX(${Math.random()*100}vw)`; flock.appendChild(b); setTimeout(()=>b.remove(),20000); }
for(let i=0;i<10;i++) spawnBird(); setInterval(spawnBird,2800);

/* Interactive ghost heart */
const heart=document.getElementById('heart');
function burst(x,y){
  for(let i=0;i<14;i++){
    const d=document.createElement('div'); d.style.position='fixed'; d.style.left=x+'px'; d.style.top=y+'px';
    d.style.width='10px'; d.style.height='10px'; d.style.background= i%2? '#ff3b81':'#ff3366'; d.style.transform='rotate(45deg)'; d.style.pointerEvents='none';
    d.style.borderRadius='2px'; document.body.appendChild(d);
    const dx=(Math.random()-0.5)*140, dy=-(20+Math.random()*160), rot=Math.random()*360;
    d.animate([{transform:'translate(0,0) rotate(45deg)', opacity:.95},{transform:`translate(${dx}px,${dy}px) rotate(${rot}deg)`, opacity:0}],{duration:900+Math.random()*600,easing:'cubic-bezier(.2,.7,.2,1)'});
    setTimeout(()=>d.remove(),1600);
  }
}
function vibrate(ms){ if('vibrate' in navigator) navigator.vibrate(ms); }
heart.addEventListener('click', (e)=>{ burst(e.clientX, e.clientY); vibrate([20,40,20]); });

/* Flow */
const wrap=document.getElementById('wrap'); const nextBtn=document.getElementById('next'); const backBtn=document.getElementById('back');
const flow=[
  {kind:'chips', prompt:'How should I hold you tonight?', options:['Hand in hand','Arm around you','Both, closer']},
  {kind:'chips', prompt:'Your favorite kind of black?', options:['Velvet black','Ink black','Moon‑shadow black']},
  {kind:'chips', prompt:'Raven sign I should send?', options:['Forehead kiss','Back hug','Cheek nudge']},
  {kind:'hold',  prompt:'Touch & hold for a heartbeat so the ghost hears it.'},
  {kind:'chips', prompt:'Midnight snack for us?', options:['Cheeseburgers','Farmhouse pizza','Both 😋']},
  {kind:'chips', prompt:'Where do we sit?', options:['Rooftop breeze','Park bench','Window seat with chai']},
  {kind:'confirm',prompt:'Close your eyes for 5 seconds. Did you feel my hand find yours?'},
  {kind:'final',  prompt:'Manu, will you be mine forever?'}
];
let idx=0; let answers=[];
function chip(text){ const b=document.createElement('button'); b.className='chip'; b.textContent=text;
  b.onclick=(e)=>{ answers[idx]=text; document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); b.classList.add('active'); burst(e.clientX,e.clientY); vibrate(15); setTimeout(next,350); };
  return b;
}
function render(){
  wrap.innerHTML=''; backBtn.disabled=(idx===0);
  const f=flow[idx];
  const s=document.createElement('section'); s.className='q show';
  const p=document.createElement('div'); p.className='prompt'; p.textContent=f.prompt; s.appendChild(p);
  if(f.kind==='chips'){ const box=document.createElement('div'); box.className='chips'; f.options.forEach(o=>box.appendChild(chip(o))); s.appendChild(box); nextBtn.disabled=false; }
  if(f.kind==='hold'){
    const b=document.createElement('button'); b.className='btn primary pill'; b.textContent='Touch & Hold';
    let t; const start=()=>{ b.textContent='Holding...'; t=setTimeout(()=>{ answers[idx]='held'; burst(window.innerWidth/2, window.innerHeight/2); next(); },1000); vibrate(20); };
    const stop=()=>{ b.textContent='Touch & Hold'; clearTimeout(t); };
    b.addEventListener('mousedown',start); b.addEventListener('mouseup',stop); b.addEventListener('mouseleave',stop);
    b.addEventListener('touchstart',e=>{ e.preventDefault(); start(); },{passive:false});
    b.addEventListener('touchend',e=>{ e.preventDefault(); stop(); },{passive:false});
    s.appendChild(b); nextBtn.disabled=true;
  }
  if(f.kind==='confirm'){
    const box=document.createElement('div'); box.className='choices';
    const y=document.createElement('button'); y.className='btn primary pill'; y.textContent='Yes'; y.onclick=(e)=>{ answers[idx]='yes'; burst(e.clientX||innerWidth/2, e.clientY||innerHeight/2); next(); };
    const m=document.createElement('button'); m.className='btn pill'; m.textContent='One more breath'; m.onclick=()=>{ answers[idx]='pause'; setTimeout(next,2000); };
    box.appendChild(y); box.appendChild(m); s.appendChild(box); nextBtn.disabled=true;
  }
  if(f.kind==='final'){
    const box=document.createElement('div'); box.className='choices';
    const yes=document.createElement('a'); yes.className='btn primary pill'; yes.textContent='Yes, forever';
    yes.href='https://api.whatsapp.com/send?text=Yes%20%E2%9D%A4%EF%B8%8F%20Forever%20with%20you.'; yes.target='_blank'; yes.rel='noopener';
    const talk=document.createElement('a'); talk.className='btn pill'; talk.textContent='Let’s talk';
    talk.href='https://api.whatsapp.com/send?text=Let%E2%80%99s%20talk%20about%20forever%20%F0%9F%92%AD'; talk.target='_blank'; talk.rel='noopener';
    yes.onclick=(e)=>{ e.preventDefault(); burst(innerWidth/2, innerHeight/2); vibrate([30,40,30]); setTimeout(()=>window.open(yes.href,'_blank'), 450); };
    box.appendChild(yes); box.appendChild(talk); s.appendChild(box); nextBtn.disabled=true;
  }
  wrap.appendChild(s);
}
function next(){ if(idx<flow.length-1){ idx++; render(); } }
function back(){ if(idx>0){ idx--; render(); } }
nextBtn.addEventListener('click', next); backBtn.addEventListener('click', back);
/* Swipe */
let sx=0, sy=0; document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX; sy=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; if(Math.abs(dx)>60 && Math.abs(dy)<80){ dx<0?next():back(); }},{passive:true});
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') next(); if(e.key==='ArrowLeft') back(); });
render();

/* Simple ambience using WebAudio */
let ctx, osc, gain, on=false; document.getElementById('vibe').onclick=()=>{
  if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)(); osc=ctx.createOscillator(); gain=ctx.createGain();
    osc.type='sine'; osc.frequency.value=174; gain.gain.value=0.018; osc.connect(gain).connect(ctx.destination); osc.start(); on=true; event.target.textContent='Pause ambience'; }
  else if(on){ ctx.suspend(); on=false; event.target.textContent='Play ambience'; }
  else { ctx.resume(); on=true; event.target.textContent='Pause ambience'; }
};
</script>
</body>
</html>
